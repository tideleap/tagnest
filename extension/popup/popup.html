<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TagNest 一键收纳</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <img class="mark" src="../icons/icon48.png" alt="" width="28" height="28" />
        <div>
          <h1>TagNest 一键收纳</h1>
          <div class="sub" id="tagline">收藏与归档，一步到位</div>
        </div>
      </header>

      <div class="status" id="status" hidden>
        <span class="dot"></span>
        <span class="text" id="statusText"></span>
      </div>

      <!-- P1: proactive setup guide shown only when the extension is not configured -->
      <div class="guide-card" id="guideCard" hidden>
        <div class="guide-title">欢迎使用 TagNest</div>
        <div class="guide-desc">完成三步配对，即可开始一键收纳书签</div>
        <ol class="guide-steps">
          <li>填写服务器地址与 API 密钥</li>
          <li>测试连接</li>
          <li>保存配置</li>
        </ol>
        <button class="btn btn-primary guide-btn" id="guideGoBtn" type="button">
          <span class="glyph">→</span><span>去配对</span>
        </button>
      </div>

      <div class="mode-badge" id="modeBadge" hidden></div>

      <!-- CS-P4-2 (C5-4): sync status — last sync, pending upload, coverage -->
      <div class="sync-status" id="syncStatus" hidden>
        <div class="sync-row">
          <span class="sync-label">最近同步</span>
          <span class="sync-value" id="lastSyncText">—</span>
        </div>
        <div class="sync-row">
          <span class="sync-label">待上行</span>
          <span class="sync-value" id="pendingUploadText">—</span>
        </div>
        <div class="sync-row">
          <span class="sync-label">分类覆盖率</span>
          <span class="sync-value" id="coverageText">—</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="savePage" type="button">
          <span class="glyph">＋</span><span>收藏当前页</span>
        </button>
        <button class="btn btn-secondary" id="captureWindow" type="button">
          <span class="glyph">▣</span><span>收纳整个窗口</span>
        </button>
        <button class="btn btn-secondary" id="openSync" type="button">
          <span class="glyph">⇄</span><span>同步对账</span>
        </button>
        <button class="btn btn-secondary" id="openTwoWaySync" type="button">
          <span class="glyph">⇄</span><span>双向同步</span>
        </button>
        <button class="btn btn-secondary" id="openCategoryBuild" type="button">
          <span class="glyph">▤</span><span>构建分类书签栏</span>
        </button>
      </div>

      <label class="note-field" for="noteInput">
        <span class="note-label">笔记（可选）</span>
        <textarea
          id="noteInput"
          class="note-input"
          rows="2"
          maxlength="20000"
          placeholder="随收藏记一笔想法，会存进书签笔记"
        ></textarea>
      </label>

      <div class="result" id="result" hidden></div>

      <footer class="footer">
        <span class="hint" id="shortcutHint">Ctrl+Shift+S 收藏当前页 · Ctrl+Shift+T 收纳窗口</span>
        <a class="link" id="openOptions" role="button" tabindex="0">设置</a>
      </footer>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
