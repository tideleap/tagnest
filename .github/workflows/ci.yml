name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # Backend logic only; runs in plain Node without a live D1.
        run: npm test

      - name: UI component tests
        # Front-end components in a happy-dom environment via React Testing
        # Library. Catches UI regressions (theme switching, cards, import) that
        # the backend suite cannot see.
        run: npm run test:ui

      - name: Theme consistency
        # Fails if the extension's hand-mirrored palette blocks drift from the
        # SPA's theme.css.
        run: npm run themes:check

      - name: Contrast (WCAG 2.x)
        # Fails if any checked foreground/background token pair in the 5 theme
        # palettes drops below its WCAG threshold (AA text ≥4.5, UI ≥3.0),
        # unless the pair is a registered exception. See scripts/check-contrast.mjs.
        run: npm run contrast:check

      - name: Design-system lint rules (RuleTester)
        # Regression suite for the three custom ESLint rules that enforce the
        # UI Design System contract. The gate degraded once before precisely
        # because the rules had no tests; this keeps them honest.
        run: npm run test:rules

      - name: Backlog consistency
        # Fails when docs/backlog.json claims a status the repository does not
        # support, in either direction. Keeps the requirement ledger honest.
        run: npm run backlog:check
