name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Serialise deployments per ref so a fast follow-up push doesn't race a slow one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # Run when Cloudflare creds are set. Supports either an API Token
    # (CLOUDFLARE_API_TOKEN) or a Global API Key + email
    # (CLOUDFLARE_API_KEY + CLOUDFLARE_EMAIL). Skipped (not failed) otherwise.
    if: ${{ (secrets.CLOUDFLARE_API_TOKEN != '' || (secrets.CLOUDFLARE_API_KEY != '' && secrets.CLOUDFLARE_EMAIL != '')) && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          apiKey: ${{ secrets.CLOUDFLARE_API_KEY }}
          email: ${{ secrets.CLOUDFLARE_EMAIL }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=tagnest --branch=main --commit-dirty=true

      - name: Deploy (preview)
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          apiKey: ${{ secrets.CLOUDFLARE_API_KEY }}
          email: ${{ secrets.CLOUDFLARE_EMAIL }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=tagnest --branch=pr-${{ github.event.pull_request.number }}
