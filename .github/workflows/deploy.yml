name: Deploy

# Triggered on any push to `main` (production), pull requests (preview), or
# manually via workflow_dispatch. Production deploy also runs DB migrations by
# default; toggle RUN_DB_MIGRATIONS for a deploy-only run.
on:
  workflow_dispatch:
    inputs:
      run_db_migrations:
        description: 'Apply pending D1 migrations before deploy (production only)'
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serialise deployments per ref so a fast follow-up push doesn't race a slow one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned for reproducibility; bump deliberately. Read from package.json via
  # the build to keep the two in agreement.
  NODE_VERSION: 22
  # Pages project name. Defaults to "tagnest"; forkers override via a repo
  # variable so the one-click flow provisions their own project.
  CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'tagnest' }}

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Quality gates run independently in ci.yml. The deploy job builds the
      # production bundle and ships it; we keep it focused and fast.
      - name: Build
        # `tsc -b && vite build`; CI runs on Linux so the sandbox `dist`-delete
        # guard does not apply here.
        run: npm run build

      - name: Validate dist
        # Fail fast if the deploy would ship a broken shell or lose headers.
        run: |
          test -f dist/index.html || { echo 'dist/index.html missing'; exit 1; }
          test -f dist/_headers || { echo 'dist/_headers missing — security headers lost'; exit 1; }
          grep -q 'Content-Security-Policy' dist/_headers || { echo 'CSP header missing'; exit 1; }
          grep -q 'Strict-Transport-Security' dist/_headers || { echo 'HSTS header missing'; exit 1; }
          echo 'dist validation passed'

      # Resolve credential presence without putting `secrets.*` in an `if:`
      # (GitHub's workflow_dispatch preflight rejects secrets in job/step `if`).
      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          if [ -n "$CF_TOKEN" ] || { [ -n "$CF_KEY" ] && [ -n "$CF_EMAIL" ]; }; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials not configured (need CLOUDFLARE_API_TOKEN or CLOUDFLARE_API_KEY+CLOUDFLARE_EMAIL); skipping deploy."
          fi

      # One-click provisioning. Idempotent: for the upstream repo every
      # resource already exists, so this is a no-op; for a freshly forked repo
      # it creates the D1 database, R2 bucket, and KV namespace, rewrites the
      # new ids into wrangler.toml, generates a JWT_SECRET, and applies
      # migrations — so the user never touches the dashboard or CLI.
      - name: Provision infrastructure (idempotent, fork-friendly)
        # Never block a release on provisioning. On the upstream repo every
        # resource already exists and migrations are applied separately, so a
        # provisioning hiccup (e.g. the CI token lacking D1/R2/KV scope) must
        # not skip the Pages deploy + health check that follow. Forks with a
        # fully-scoped token still get their resources created here.
        continue-on-error: true
        if: steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ env.CF_PAGES_PROJECT }}
        run: node scripts/setup-infra.mjs

      # Production-only DB migrations.
      #
      # Two-phase so a release is never silently under-migrated:
      #   1. Probe D1 scope. Some Cloudflare tokens can deploy Pages but lack
      #      `Account > D1 > Edit`. In that case we *degrade*: skip the schema
      #      change, finish the release, and flag it in the summary so an
      #      operator fixes the token. The probe itself is non-blocking.
      #   2. If D1 is reachable, migrations are BLOCKING: a real apply failure
      #      stops the deploy (correctness over speed) and surfaces in CI.
      # The deploy job (below) is gated on `steps.migrate.outcome != 'failure'`,
      # so only a hard failure with D1 available can hold a release.
      - name: Probe D1 scope
        id: d1probe
        if: github.ref == 'refs/heads/main' && steps.cf.outputs.configured == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if node scripts/probe-d1.mjs; then
            echo "title=D1 reachable" >> "$GITHUB_OUTPUT"
            echo "has_d1=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_d1=false" >> "$GITHUB_OUTPUT"
            echo "D1 scope not available on this token; skipping schema migrations for this release."
          fi

      - name: Apply D1 migrations (production)
        if: github.ref == 'refs/heads/main' && steps.cf.outputs.configured == 'true' && steps.d1probe.outputs.has_d1 == 'true' && (
            inputs.run_db_migrations != false ||
            github.event_name != 'workflow_dispatch'
          )
        id: migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/migrate.mjs
          echo "migrated=ok" >> "$GITHUB_OUTPUT"

      - name: Deploy (production)
        # Gated on the migration outcome: when D1 was available and migrations
        # actually FAILED, hold the release (correctness). When D1 was not
        # available (degraded) or migrations succeeded/skipped, ship.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.cf.outputs.configured == 'true' && steps.migrate.outcome != 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          apiKey: ${{ secrets.CLOUDFLARE_API_KEY }}
          email: ${{ secrets.CLOUDFLARE_EMAIL }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true

      - name: Post-deploy health check (production)
        # The release is only considered LIVE after /api/health answers ok on
        # the production alias. If it does not come up within the window this
        # step fails and (below) triggers an automatic rollback.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.cf.outputs.configured == 'true' && steps.migrate.outcome != 'failure'
        id: health
        run: |
          node scripts/health-check.mjs \
            --base=https://${{ env.CF_PAGES_PROJECT }}.pages.dev \
            --retries=8 --interval=8000
          echo "health=ok" >> "$GITHUB_OUTPUT"

      - name: Automatic rollback on failed health check
        # If the fresh deploy never came up healthy, restore service from the
        # last commit known to be live (github.event.before on a push). Rollback
        # itself ends with a health check, so it only reports success when the
        # previous release is genuinely serving again.
        if: ${{ failure() && steps.health.outcome == 'failure' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        id: rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TARGET=""
          if [ "${{ github.event_name }}" = "push" ]; then
            TARGET="${{ github.event.before }}"
          fi
          if [ -z "$TARGET" ] || [ "$TARGET" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to roll back to; skipping rollback."
            echo "ROLLBACK_DONE=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Rolling back to $TARGET"
          node scripts/rollback.mjs --ref="$TARGET" --project=${{ env.CF_PAGES_PROJECT }} --branch=main --base=https://${{ env.CF_PAGES_PROJECT }}.pages.dev
          echo "ROLLBACK_DONE=yes" >> "$GITHUB_OUTPUT"

      - name: Deploy (preview)
        if: github.event_name == 'pull_request' && steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          apiKey: ${{ secrets.CLOUDFLARE_API_KEY }}
          email: ${{ secrets.CLOUDFLARE_EMAIL }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=pr-${{ github.event.pull_request.number }}

      # Emit a machine-readable deployment record regardless of the preceding
      # steps, so the Actions UI and log searches show the exact target.
      - name: Deployment summary
        if: always()
        run: |
          echo "## Deploy summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${{ github.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: ${{ (github.ref == 'refs/heads/main' && format('production (https://{0}.pages.dev)', env.CF_PAGES_PROJECT)) || format('preview (pr-{0}.{1}.pages.dev)', github.event.pull_request.number, env.CF_PAGES_PROJECT) }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.d1probe.outputs.has_d1 }}" = "false" ]; then
            echo "- ⚠️ DB migrations: **skipped (token lacks \`Account > D1 > Edit\` scope)** — release continued. Add the D1 scope to the Cloudflare token, then Re-run or run \`npm run db:migrate:all\` manually." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.migrate.outcome }}" = "success" ]; then
            echo "- DB migrations: applied" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.migrate.outcome }}" = "failure" ]; then
            echo "- ✗ DB migrations: **failed — this release was HELD.** Fix the migration and push again." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Health check: ${{ (steps.health.outcome == 'success' && '✅ passed') || (steps.health.outcome == 'failure' && '❌ failed') || 'n/a (skipped)' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.rollback.outputs.ROLLBACK_DONE }}" = "yes" ]; then
            echo "- ⚠️ **Automatic rollback triggered** — restored to \`${{ github.event.before }}\` because the new release failed its health check. See the *Automatic rollback* step log." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🌐 **访问链接:** https://${{ env.CF_PAGES_PROJECT }}.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "📋 **日志摘要:** 详见下方各步骤日志；健康检查与（可能的）回滚均有独立步骤与时间戳。" >> "$GITHUB_STEP_SUMMARY"