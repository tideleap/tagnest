name = "tagnest"
pages_build_output_dir = "dist"

# HTMLRewriter streaming, FormData in Functions and the newer WebCrypto
# surface all depend on a recent compatibility date. 2026-03-24 is the minimum
# for the Browser Run `.quickAction()` snapshot binding below.
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat"]

# Created 2026-08-01 via `npx wrangler d1 create tagnest-db` (region APAC).
# database_id below is the real remote id; local dev ignores it.
[[d1_databases]]
binding = "DB"
database_name = "tagnest-db"
database_id = "26a1db40-1f6c-4bba-a8a3-52d632115508"
migrations_dir = "migrations"

# Edge cache for public share pages (O7). The code degrades to D1 when this
# binding is absent, so it is safe to add after launch.
[[kv_namespaces]]
binding = "SHARE_CACHE"
id = "e0090e3806074150badd3bf531b4fdb6"

# Per-URL cache of AI tagging results (P1-2). Keyed by URL + prompt version +
# model, so a prompt revision or model switch invalidates automatically. The
# engine degrades to "always call the model" when this binding is absent.
[[kv_namespaces]]
binding = "AI_CACHE"
id = "23407e65600b4830bb2e23f9f2879322"

# Website snapshots ("website preview image") live in R2. The bucket must be
# created before deploy. Use the existing bucket created in the Cloudflare
# dashboard (APAC region).
#
# Capture provider precedence:
#   1. SNAPSHOT_API_URL   — external screenshot API, if you set it.
#   2. [browser] binding  — Cloudflare Browser Run (self-hosted, no third party).
# Neither configured ⇒ snapshots are skipped and cards fall back to the remote
# coverUrl / circle badge (no error).
#
# Page env vars (SNAPSHOT_API_URL / SNAPSHOT_API_KEY) are bound per-deployment —
# add them, then trigger a fresh deploy. Verify the chain with
# `scripts/verify-snapshot.mjs`.
[[r2_buckets]]
binding = "SNAPSHOT_BUCKET"
bucket_name = "tagnest-media"

# Cloudflare Browser Run (formerly Browser Rendering) — capture website
# snapshots on Cloudflare's own network. Requires the Browser Run service to be
# enabled on the account/dashboard (free tier available). The binding is absent
# on instances that have not enabled it; the pipeline degrades gracefully.
[browser]
binding = "BROWSER"

[vars]
# Non-secret defaults. JWT_SECRET is deliberately absent — set it with
#   npx wrangler pages secret put JWT_SECRET
# so it is never committed.
DISABLE_SIGNUP = "false"
# Open-but-gated registration. Empty = anyone may sign up. Set a comma-separated
# allowlist of exact emails or domain wildcards, e.g. "alice@x.com, *@corp.dev".
# Ignored when DISABLE_SIGNUP=true.
ALLOWED_EMAILS = ""

# Cross-origin callers allowed to hit the API (browser extensions, companion
# apps, the CLI over fetch). Comma/space-separated exact origins, e.g.
# "https://ext.example.com https://app.example.com". Empty = same-origin only;
# the request Origin is echoed back only when listed here (credentials-aware
# CORS — never "*").
ALLOWED_ORIGINS = ""
