name = "tagnest"
pages_build_output_dir = "dist"

# HTMLRewriter streaming, FormData in Functions and the newer WebCrypto
# surface all depend on a recent compatibility date.
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Created 2026-08-01 via `npx wrangler d1 create tagnest-db` (region APAC).
# database_id below is the real remote id; local dev ignores it.
[[d1_databases]]
binding = "DB"
database_name = "tagnest-db"
database_id = "26a1db40-1f6c-4bba-a8a3-52d632115508"
migrations_dir = "migrations"

# Edge cache for public share pages (O7). The code degrades to D1 when this
# binding is absent, so it is safe to add after launch.
[[kv_namespaces]]
binding = "SHARE_CACHE"
id = "e0090e3806074150badd3bf531b4fdb6"

[vars]
# Non-secret defaults. JWT_SECRET is deliberately absent — set it with
#   npx wrangler pages secret put JWT_SECRET
# so it is never committed.
DISABLE_SIGNUP = "false"
# Open-but-gated registration. Empty = anyone may sign up. Set a comma-separated
# allowlist of exact emails or domain wildcards, e.g. "alice@x.com, *@corp.dev".
# Ignored when DISABLE_SIGNUP=true.
ALLOWED_EMAILS = ""
