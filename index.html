<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="TagNest — 快速、键盘优先的书签管理器" />
    <meta name="theme-color" content="#4F46E5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TagNest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TagNest</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong palette. The persisted value can be any known palette key
      // (light/dark/aurora/blossom/starlight); unknown/absent -> OS default.
      (function () {
        try {
          var stored = localStorage.getItem('tagnest.theme');
          var known =
            stored === 'light' ||
            stored === 'dark' ||
            stored === 'aurora' ||
            stored === 'blossom' ||
            stored === 'starlight';
          var mode = known
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          /* private mode — fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
